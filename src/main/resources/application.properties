spring.application.name=back
server.port=${PORT:8080}

# Configuracoes do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria tableas do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate esta executando
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracoes do Cloudflare Turnstile
cloudflare.turnstile.secret=${TURNSTILE_SITE_KEY}